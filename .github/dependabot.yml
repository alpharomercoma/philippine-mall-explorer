# Third-party actions are pinned to commit SHAs (a tag can be moved to new
# code; a SHA cannot). This keeps those pins current: Dependabot proposes the
# new SHA with its version comment, and the Tests check runs on the PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR a month for all of them. Separately they hit Dependabot's limit of
    # five open PRs, which silently held back the checkout bump, and bumps that
    # touch neighbouring lines conflict with each other once one is merged.
    groups:
      actions:
        patterns: ["*"]
