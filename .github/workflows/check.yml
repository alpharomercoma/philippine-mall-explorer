# Weekly check: run everything the monthly rescrape runs, against the live
# operators, and fail loudly on anything someone has to act on. Nothing is
# committed or deployed; the snapshot it builds dies with the run.
#
# Why it exists: the monthly run is built to publish through trouble. A chain
# that fails is carried forward from the previous snapshot, a mall that fails
# is left out, and the site still updates, so a broken operator can go
# unnoticed for a month. This check turns each of those into a red run:
# - any job of the pipeline failing: a chain's scrape, the assembly,
#   geocoding, the build, lint or the tests
# - `mallscape check`: a chain or mall whose scrape raised, a chain carried
#   forward, a scraper alert (roster or markup drift), or a mall with no
#   tenants that registry/empty_directories.json does not account for
#
# Both runs are pipeline.yml, so this is the monthly run minus its last two
# jobs (publish and deploy) and minus `geocode --verify` (one reverse lookup
# per property against OpenStreetMap, fine monthly and rude weekly). SM goes
# through the same rotating proxy, so a week costs about the same proxy
# traffic as a month.
#
# A failing run on main opens an issue labelled weekly-check, or comments on
# the open one, and the first passing run closes it. GitHub also emails the
# failure to whoever last edited the cron line below.
name: Weekly check

on:
  schedule:
    # 18:17 on Monday, Philippine time (UTC+8). Chosen so it can never overlap
    # the monthly rescrape, which starts 22:00 UTC on the 1st and finishes
    # within hours: the two never put two full scrapes on the operators and
    # the proxy at once.
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions: {}

# Its own group, not the rescrape's. GitHub keeps one pending run per group
# and cancels it when another queues, so sharing one would let a dispatched
# check silently cancel a queued monthly run, which publishes the month.
concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/pipeline.yml
    with:
      publish: false
    secrets:
      WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
    # The ceiling for every job in the pipeline. GitHub checks it against the
    # permissions each job declares before the run starts, including the
    # publish and deploy jobs that `publish: false` skips, so it has to admit
    # theirs. No token here carries them: every job is issued only the
    # permissions it declares, and those two jobs never run from here.
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
