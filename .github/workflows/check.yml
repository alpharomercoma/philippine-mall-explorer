# Weekly check: run everything the monthly rescrape runs, against the live
# operators, and fail loudly on anything someone has to act on. Nothing is
# committed or deployed; the snapshot it builds dies with the runner.
#
# Why it exists: the monthly run is built to publish through trouble. A chain
# that fails is carried forward from the previous snapshot, a mall that fails
# is left out, and the run still goes green, so a broken operator can go
# unnoticed for a month. This check turns each of those into a red run:
# - the scrape, the build or the tests failing outright
# - `mallscape check`: a chain or mall whose scrape raised, a chain carried
#   forward, a scraper alert (roster or markup drift), or a mall with no
#   tenants that registry/empty_directories.json does not account for
#
# A failing run on main opens an issue labelled weekly-check, or comments on
# the open one, and the first passing run closes it. GitHub also emails the
# failure to whoever last edited the cron line below.
#
# It skips `geocode --verify` (one reverse lookup per property against
# OpenStreetMap, fine monthly and rude weekly). SM goes through the same
# rotating proxy as the monthly run, so a week costs about the same proxy
# traffic as a month.
name: Weekly check

on:
  schedule:
    - cron: "17 22 * * 0" # 06:17 on Monday, Philippine time (UTC+8)
  workflow_dispatch:

permissions: {}

# Shared with the monthly rescrape, so the operators and the proxy never see
# two full scrapes at once; whichever starts second waits.
concurrency:
  group: rescrape
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    env:
      # Same retry budget as the monthly run, so this predicts what it would do.
      MALLSCAPE_RETRY_ATTEMPTS: 4
      MALLSCAPE_RETRY_MAX_WAIT: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies and the end-to-end browser
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      # Fixed once: the scrape starts late on Sunday UTC and can finish on Monday.
      - name: Fix the run date
        run: echo "RUN_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Scrape every operator
        id: scrape
        continue-on-error: true
        env:
          # Scoped to this step: it carries the proxy account's token.
          MALLSCAPE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
        run: |
          for attempt in 1 2; do
            uv run mallscape scrape --date "$RUN_DATE" && break
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo "scrape failed; retrying in 10 minutes against the cache"
            sleep 600
          done

      - name: Check what the scrape found
        id: health
        continue-on-error: true
        run: |
          set -o pipefail
          uv run mallscape check --date "$RUN_DATE" | tee check.md

      - name: Geocode new properties, clean, report, build the site
        id: build
        if: ${{ steps.scrape.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run mallscape geocode --date "$RUN_DATE"
          uv run mallscape clean --date "$RUN_DATE"
          uv run mallscape report --date "$RUN_DATE"
          uv run mallscape website --date "$RUN_DATE"

      - name: Lint and test, including the built site
        id: tests
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run pytest tests/test_unit.py tests/test_integration.py -q
          uv run pytest tests/test_e2e.py -q

      - name: Keep the run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-check-${{ env.RUN_DATE }}
          path: |
            data/snapshots/${{ env.RUN_DATE }}/1_scrape/run_report.md
            data/snapshots/${{ env.RUN_DATE }}/1_scrape/health.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarise, and open, update or close the weekly-check issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAPE: ${{ steps.scrape.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ok=true
          for outcome in "$SCRAPE" "$HEALTH" "$BUILD" "$TESTS"; do
            [ "$outcome" = success ] || ok=false
          done
          {
            echo "## Weekly check, ${RUN_DATE:-not started}"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| scrape every operator | ${SCRAPE:-not run} |"
            echo "| check what it found | ${HEALTH:-not run} |"
            echo "| build | ${BUILD:-not run} |"
            echo "| lint and test | ${TESTS:-not run} |"
            echo
            cat check.md 2>/dev/null || echo "_The check never ran._"
            echo
            echo "[Run log and run report]($run_url)"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          # A dispatch from a branch is testing that branch, not main's health.
          [ "$ON_MAIN" = true ] || exit 0
          open=$(gh issue list --label weekly-check --state open --json number --jq '.[0].number // empty')
          if $ok; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Passing again: $run_url"; fi
          else
            gh label create weekly-check --force --color B60205 \
              --description "Opened and closed by the weekly check"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file body.md
            else
              gh issue create --title "Weekly check failing" --label weekly-check --body-file body.md
            fi
          fi

      # failure() also catches the install, before any of the checks ran.
      - name: Fail loudly
        if: ${{ !cancelled() && (failure() || steps.scrape.outcome != 'success' || steps.health.outcome != 'success' || steps.build.outcome != 'success' || steps.tests.outcome != 'success') }}
        env:
          SCRAPE: ${{ steps.scrape.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "::error title=Weekly check failed::scrape: ${SCRAPE:-not run}, check: ${HEALTH:-not run}, build: ${BUILD:-not run}, tests: ${TESTS:-not run}. The run summary and the weekly-check issue list every problem."
          if [ -f check.md ]; then
            grep '^- ' check.md | while IFS= read -r line; do
              echo "::error title=Weekly check::${line#- }"
            done
          fi
          exit 1
