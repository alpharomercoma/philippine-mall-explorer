# Monthly refresh: scrape every operator, rebuild the data and the site,
# commit the new snapshot to main, and deploy to GitHub Pages.
#
# When it runs is the cron line below; GitHub has no way to feed a schedule
# from a variable, so changing the cadence is a one-line edit here. The
# workflow_dispatch trigger runs the same job on demand from the Actions tab.
# GitHub disables cron on repos with no activity for 60 days; a monthly
# snapshot commit is itself activity, so a green run keeps the schedule alive.
#
# Failure behavior, outermost to innermost:
# - Each HTTP request retries 403/429/5xx and transport failures with
#   exponential backoff (4 attempts, up to 60s here) inside the scraper.
# - Every chain is scraped in a job of its own (pipeline.yml), run twice with
#   a 10 minute pause. Responses are cached on disk for the life of the job,
#   so the second attempt refetches only what failed.
# - A chain that fails outright, or whose listings collapse against the
#   previous snapshot, keeps that snapshot's rows and is named in the run
#   report with its original fetched date. Its job is red; the month still
#   publishes.
# - Two operators wall off GitHub's runners (verified live 2026-10-13).
#   WalterMart and Araneta sit behind Cloudflare, whose bot check passes the
#   browser TLS fingerprint the fetcher presents. SM's AWS WAF refuses the
#   runner IP range whatever the client, so SM's job goes out through the
#   rotating residential proxy in the WEBSHARE_PROXY_URL secret, on a new
#   connection, and so a new exit IP, for every request. If the secret is
#   missing or the proxy is down, SM is carried forward like any other
#   failed chain.
# - If geocoding, the build, lint or the tests fail, nothing is committed or
#   deployed: a bad month publishes nothing and the site keeps serving the
#   last good snapshot. The failed run is visible (and emailed) via Actions.
# - A chain carried forward, a mall that failed or a scraper alert still
#   publishes. check.yml runs this same pipeline weekly without publishing
#   and fails loudly on those instead.
name: Monthly rescrape

on:
  schedule:
    - cron: "0 22 1 * *" # 06:00 on the 2nd, Philippine time (UTC+8)
  workflow_dispatch:
    inputs:
      accept_collapse:
        description: >-
          Chains whose listing collapse is real and should be accepted this
          run (comma separated, or "all"). Leave empty normally.
        required: false
        default: ""

permissions: {}

concurrency:
  group: rescrape
  cancel-in-progress: false

jobs:
  rescrape:
    uses: ./.github/workflows/pipeline.yml
    with:
      publish: true
      accept_collapse: ${{ inputs.accept_collapse }}
    secrets:
      WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
    # The ceiling for every job in the pipeline; each job asks only for what
    # it uses (only publish writes contents, only deploy touches Pages).
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
