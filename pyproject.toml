[project]
name = "mallscape"
version = "0.1.0"
description = "Recurring scraper + brand-presence analysis for PH mall directories (SM, Robinsons)"
readme = "README.md"
authors = [
    { name = "Alpha Romer Coma", email = "alpharomercoma@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "selectolax>=0.4.11",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
]

[project.scripts]
mallscape = "mallscape.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pipeline stages live in numbered directories for readability; the packages
# inside them carry valid Python identifiers. Stage N may import stages < N
# and `mallscape_core`, never the reverse.
[tool.hatch.build.targets.wheel]
packages = [
    "common/mallscape_core",
    "1_scrape/mallscape_scrape",
    "2_clean/mallscape_clean",
    "3_report/mallscape_report",
    "4_website/mallscape_website",
    "cli/mallscape",
]

[tool.hatch.build.targets.wheel.force-include]
"1_scrape/mallscape_scrape/registry" = "mallscape_scrape/registry"

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
markers = ["e2e: drives the built site in a browser; needs `mallscape build` and playwright"]
pythonpath = ["common", "1_scrape", "2_clean", "3_report", "4_website", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["common", "1_scrape", "2_clean", "3_report", "4_website", "cli"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]  # long lines are usually prose in a docstring

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
